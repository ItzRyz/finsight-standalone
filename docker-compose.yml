services:
  postgres_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: finsight_test
      POSTGRES_PASSWORD: finsight_test
      POSTGRES_DB: finsight_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight_test"]
      interval: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
